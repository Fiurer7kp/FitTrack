<div class="min-h-screen bg-brand-black text-white">
  <header class="border-b border-brand-border bg-brand-card/90 backdrop-blur-sm">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6 lg:px-8">
      <a href="/dashboard" class="font-heading text-2xl font-bold text-white" aria-label="FitTrack, inicio">
        Fit<span class="text-brand-neon">Track</span>
      </a>
      <div class="flex flex-wrap items-center gap-2">
        @for (item of navItems; track item.path) {
          <a [href]="item.path" class="rounded-lg border border-brand-border px-3 py-2 text-sm text-neutral-300 transition hover:border-neutral-500 hover:text-white">
            {{ item.label }}
          </a>
        }
      </div>
    </nav>
  </header>

  <main>
    <div class="px-4 py-8 sm:px-6 lg:px-8">
      <p class="text-neutral-400">Pantalla de contenido principal.</p>
    </div>
  </main>
</div>
