<main class="min-h-screen px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-brand-neon">Entrenamiento</p>
        <h1 class="font-heading text-3xl font-bold text-white">Temporizador</h1>
      </div>
      <a href="/dashboard" class="rounded-lg border border-brand-border px-4 py-2 text-sm text-neutral-300 transition hover:border-neutral-500 hover:text-white">
        Volver al dashboard
      </a>
    </header>

    <section class="rounded-3xl border border-brand-border bg-brand-card p-8 text-center">
      <p class="text-sm uppercase tracking-[0.3em] text-neutral-400">Tiempo restante</p>
      <p class="mt-5 font-heading text-6xl font-bold text-white">{{ formattedTime }}</p>

      <div class="mt-8 flex flex-wrap justify-center gap-3">
        @for (preset of presets; track preset) {
          <button type="button" class="rounded-full border border-brand-border px-4 py-2 text-sm text-neutral-200 transition hover:border-neutral-500" (click)="setPreset(preset)">
            {{ preset }} min
          </button>
        }
      </div>

      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <button type="button" class="btn-neon" (click)="start()" [disabled]="running()">Iniciar</button>
        <button type="button" class="rounded-lg border border-brand-border px-5 py-3 text-sm text-neutral-200 transition hover:border-neutral-500" (click)="pause()">Pausar</button>
        <button type="button" class="rounded-lg border border-brand-border px-5 py-3 text-sm text-neutral-200 transition hover:border-neutral-500" (click)="reset()">Reiniciar</button>
      </div>
    </section>
  </div>
</main>
