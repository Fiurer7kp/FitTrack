<button
  type="button"
  class="fixed right-4 top-4 z-50 rounded-full border border-brand-border bg-brand-card px-4 py-2 text-sm text-neutral-300 shadow-lg transition hover:border-neutral-500 hover:text-white"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  (click)="themeService.toggle()"
>
  {{ themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
</button>
@if (themeService.storageUnavailable()) {
  <p class="fixed right-4 top-16 z-50 rounded-lg border border-brand-danger/40 bg-brand-card px-3 py-2 text-xs text-red-300" role="status">
    No se pudo guardar la preferencia del tema.
  </p>
}
<router-outlet />
